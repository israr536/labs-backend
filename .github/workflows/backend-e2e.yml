name: Backend E2E

on:
  push:
    branches: [main, new-features, seo-security-e2e-improvements]
  pull_request:
    branches: [main, new-features]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pathmlt
          POSTGRES_PASSWORD: pathmlt
          POSTGRES_DB: pathmlt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathmlt -d pathmlt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pathmlt:pathmlt@localhost:5432/pathmlt_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      FRONTEND_URL: http://127.0.0.1:4173
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_DAYS: "7"
      REFRESH_COOKIE_SAMESITE: lax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: echo "ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:e2e -- --runInBand
