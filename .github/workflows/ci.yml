name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab_reporting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lab_reporting_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lab_reporting_test?schema=public
      ACCESS_TOKEN_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      ACCESS_TOKEN_TTL: 900
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx prettier --write "src/**/*.ts" "test/**/*.ts" "prisma/**/*.ts" "master-tests/**/*.ts"
      - run: npm run lint -- --no-fix
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
