name: Temporary build verification

on:
  push:
    branches: [perf/dashboard-report-optimization]

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'chore: remove temporary build verification')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
